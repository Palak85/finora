search-path = [
    "backend",
    "backend/apps",
    "backend/venv/Lib/site-packages"
]
python-interpreter-path = "backend/venv/Scripts/python.exe"

[errors]
missing-import = "ignore"
missing-attribute = "ignore"
unknown-attribute-access = "ignore"
inconsistent-override = "ignore"
bad-override = "ignore"
override-error = "ignore"
missing-type-stub = "ignore"
missing-type-stubs = "ignore"
cannot-find-type-stubs = "ignore"
bad-assignment = "ignore"
invalid-assignment = "ignore"
type-mismatch = "ignore"
attribute-error = "ignore"
no-such-attribute = "ignore"
context-manager = "ignore"
not-a-context-manager = "ignore"
invalid-context-manager = "ignore"
